name: UCAS mobile layout smoke test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chrome controller (locked versions)
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Check available browser
        run: |
          which google-chrome || which chromium
          google-chrome --version || true
      - name: Launch local test server
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/ucas-http.log 2>&1 &
          sleep 2
      - name: Validate mobile layout and offline study workflow
        run: npm run test:browser
