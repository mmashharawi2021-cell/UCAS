name: UCAS quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js sw.js; do node --check "$file"; done
      - name: Show CSS formatter diff for debugging
        run: |
          npx prettier styles.css > /tmp/ucas-prettier-css
          diff -u styles.css /tmp/ucas-prettier-css || true
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
