name: UCAS quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js sw.js; do node --check "$file"; done
      - name: Show Companion formatter differences
        run: |
          for f in js/companion.js js/app.js; do
            echo "START_FORMAT_DIFF:$f"
            npx prettier "$f" > /tmp/ucas-prettier
            diff -u "$f" /tmp/ucas-prettier || true
            echo "END_FORMAT_DIFF:$f"
          done
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
